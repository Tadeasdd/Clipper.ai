name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipper
          POSTGRES_PASSWORD: clipper
          POSTGRES_DB: clipper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clipper:clipper@localhost:5432/clipper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: node --check src/server.js
      # Boot the API (runs migrations) and exercise the full B2 surface:
      # clients → leads (dedup) → intake by URL + file → upload → queue.
      - run: |
          node src/server.js &
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && break || sleep 1; done
          npm run smoke
