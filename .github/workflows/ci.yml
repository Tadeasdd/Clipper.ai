name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint        # U5: ESLint (react-hooks + jsx-a11y), 0 errors
      - run: npm run typecheck    # U5: checkJs over the data/API layer
      - run: npm run test:ui      # U5: usePoll state-machine component tests
      - run: npm run build
      - run: npm run budget       # P1: gzip-exact perf budget on the landing-route initial graph
      - run: npm run smoke
      # Fail on high/critical vulns in SHIPPED (production) dependencies — the
      # real attack surface of the deployed app.
      - name: Audit shipped dependencies
        run: npm run audit:ci
      # Informational: the full tree incl. dev/build tooling (e.g. the esbuild
      # dev-server advisory) — surfaced in the log, not a gate, since fixing it
      # needs a breaking Vite major bump and it never ships to users. CodeQL +
      # dependency-review cover dev-dep drift on PRs.
      - name: npm audit (informational, includes dev deps)
        run: npm audit || true

  # ── P1: Lighthouse CI — real headless-Chrome perf signal on the BUILT landing
  #    page. Separate job (the action provisions Chrome + network), so the core
  #    frontend/backend gates above stay fully offline. The deterministic
  #    byte-budget gate is `npm run budget` inside the frontend job; this adds the
  #    runtime score + render-blocking + script-weight assertions (lighthouserc.json).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Lighthouse CI (perf budget on the built landing page)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/lighthouserc.json

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipper
          POSTGRES_PASSWORD: clipper
          POSTGRES_DB: clipper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clipper:clipper@localhost:5432/clipper
      # M1/M4: the offline ASR + ingest binaries CI provisions below. The cloud
      # paths (LLM_API_KEY, TRANSCRIPTION_API_KEY, RUN_LIVE_YT, PUBLISH_DRIVER=live)
      # stay unset, so every live-key/live-network assertion gates itself off.
      WHISPER_BIN: whisper-cli
      WHISPER_MODEL: ${{ github.workspace }}/.cache/whisper/ggml-tiny.en.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: node --check src/server.js
      - name: Audit shipped dependencies
        run: npm run audit:ci

      # ── toolchain: ffmpeg (render/probe), espeak-ng (ASR test fixture),
      #    yt-dlp (platform-URL ingest; live path gated), whisper.cpp + tiny model.
      - name: System media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng cmake yt-dlp || (sudo apt-get install -y -qq ffmpeg espeak-ng cmake && pipx install yt-dlp)
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/whisper
          key: whisper-tiny-en-v1
      - name: Build whisper.cpp + fetch tiny model
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/.cache/whisper"
          MODEL="${{ github.workspace }}/.cache/whisper/ggml-tiny.en.bin"
          [ -f "$MODEL" ] || curl -sL -o "$MODEL" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DGGML_METAL=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/whisper.cpp/build -j --target whisper-cli >/dev/null
          sudo cp /tmp/whisper.cpp/build/bin/whisper-cli /usr/local/bin/whisper-cli
          whisper-cli --help >/dev/null 2>&1 || true

      # ── B2: clients → leads (dedup) → intake by URL + file → upload → queue.
      - name: Boot API + B2 smoke
        run: |
          node src/server.js &
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && break || sleep 1; done
          npm run smoke

      # ── M1: offline whisper ASR → real word timestamps in analyze windows.
      - run: npm run smoke:transcribe
        env: { TRANSCRIPTION_PROVIDER: whisper }
        timeout-minutes: 4

      # ── B3–B6 + M2 (semantics beat volume) + M3 (caption burn-in) + M5
      #    (reaper recovery, dead-letter, queue depth), end to end.
      - run: npm run smoke:pipeline
        timeout-minutes: 8

      # ── S1: ingest fetch is SSRF-safe (scheme/private-range/redirect/rebinding).
      - run: npm run smoke:ssrf
        timeout-minutes: 2

      # ── M4: yt-dlp/direct ingest, size/type limits, idempotency (live YT gated).
      - run: npm run smoke:ingest
        timeout-minutes: 4

      - run: npm run smoke:review
      - run: npm run smoke:publish
        timeout-minutes: 4
      - run: npm run smoke:metrics
        timeout-minutes: 4

      # ── Q3: editor decisions become quality labels + model↔editor agreement.
      - run: npm run smoke:labels
        timeout-minutes: 3
      - run: npm run smoke:auth
        timeout-minutes: 3

      # ── R1: traces span the recording lifecycle + /metrics serves the series.
      - run: npm run smoke:observability
        timeout-minutes: 4

      # ── R2: health/readiness probes + graceful job-draining shutdown (SIGTERM).
      - run: npm run smoke:shutdown
        timeout-minutes: 4

      # ── E1: per-job cost ledger — itemized + summed + rolled up to the client.
      - run: npm run smoke:cost
        timeout-minutes: 4

      # ── E2: usage metering + plan quota enforcement (block / queue / warn).
      - run: npm run smoke:metering
        timeout-minutes: 3

      # ── E3: per-client margin = plan revenue − AI cost − editor est, sorted.
      - run: npm run smoke:margin
        timeout-minutes: 3

      # ── E4: delivered clips → reconciled billable outcomes (dry-run), idempotent,
      #        signed webhook verification — all offline.
      - run: npm run smoke:billing
        timeout-minutes: 3

      # ── O1: per-client submit→deliver turnaround vs plan SLA, late + overdue
      #        breaches surfaced, R4 SLO turnaround folded in.
      - run: npm run smoke:sla
        timeout-minutes: 3

      # ── O2: review work assigns + balances across the reviewer/editor pool,
      #        backlog clear-time forecasts from measured throughput.
      - run: npm run smoke:capacity
        timeout-minutes: 3

      # ── O3: client onboarding checklist + health score + churn signals,
      #        lifecycle stage as the operator workflow field.
      - run: npm run smoke:health
        timeout-minutes: 3

      # ── O4: lifecycle notifications (log driver), opt-out honored, SLA-risk
      #        sweep dedups — all offline.
      - run: npm run smoke:notify
        timeout-minutes: 3

      # ── O5: append-only audit feed across all areas; ops sees all, a client is
      #        scoped to its own client_visible rows.
      - run: npm run smoke:audit
        timeout-minutes: 3

      # ── P2: Core Web Vitals RUM — public beacon persists with server-derived
      #        ratings; ops aggregate computes p75 + trend; read is walled.
      - run: npm run smoke:rum
        timeout-minutes: 3

      # ── R3: timeouts + circuit breakers + bulkheads on external calls.
      - run: npm run smoke:resilience
        timeout-minutes: 2

      # ── R4: SLIs/SLOs + error budgets; a burning budget fires an alert.
      - run: npm run smoke:slo
        timeout-minutes: 3

      # ── R5: DR — portable restore drill (reproduce-to-point-in-time) + chaos
      #    drill (worker crash mid-pipeline self-heals within RTO).
      - run: npm run smoke:restore
        timeout-minutes: 3
      - run: npm run smoke:chaos
        timeout-minutes: 3

      # ── R5: the real pg_dump/pg_restore production tooling, end to end.
      - name: DR — pg_dump → pg_restore round-trip
        run: |
          sudo apt-get install -y -qq postgresql-client
          DUMP=$(BACKUP_DIR=/tmp/bk bash ops/backup/backup.sh | tail -1)
          ADMIN_URL=postgres://clipper:clipper@localhost:5432/postgres RESTORE_DB=clipper_pgrestore bash ops/backup/restore.sh "$DUMP"
          psql postgres://clipper:clipper@localhost:5432/clipper_pgrestore -tAc 'select count(*) from schema_migrations;'
        timeout-minutes: 4

      # ── S4: cross-tenant IDOR — id-addressed resources are tenant-scoped (404).
      - run: npm run smoke:authz
        timeout-minutes: 3

      # ── M7: production config — secrets fail-fast, CORS lock, headers, limits.
      - run: npm run smoke:prod
        timeout-minutes: 3

      # ── M8: the one-command demo must keep producing real captioned clips.
      - run: npm run seed:demo
        timeout-minutes: 4

      # ── Q2: AI provenance + versioned prompts are stamped + reproducible.
      - run: npm run smoke:provenance
        timeout-minutes: 3

      # ── Q4: identical content is cached (ASR + analysis); router prefers cheap.
      - run: npm run smoke:cache
        timeout-minutes: 3

      # ── Q5: online calibration tracks drift and a simulated decay alerts.
      - run: npm run smoke:drift
        timeout-minutes: 3

      # ── Q1: clip-quality regression gate — the real analyze+score pipeline
      #    must keep ranking the labelled good clips at/above the baseline.
      - run: npm run eval
        timeout-minutes: 5

  # ── F4/F5: render the BUILT ops dashboard + client portal in happy-dom against
  #    a live backend, click through a real review / sign-off, verify the
  #    transitions + audit rows in Postgres. The integration scripts read the DB
  #    directly (`pg`), so NODE_PATH points at the backend's modules.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipper
          POSTGRES_PASSWORD: clipper
          POSTGRES_DB: clipper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clipper:clipper@localhost:5432/clipper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg (render the review/portal clips)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Backend deps + boot the API
        working-directory: backend
        run: |
          npm ci
          node src/server.js &
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && break || sleep 1; done
      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: F4 ops review + F5 portal sign-off (against the live backend)
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/backend/node_modules
        run: |
          npm run integration:f4
          npm run integration:f5

  # ── P3: Playwright E2E + visual-regression DESIGN LOCK. Runs INSIDE the same
  #    pinned image the baselines were generated in (playwright:v1.61.0-jammy) so
  #    the screenshot compare is byte-stable. The journey specs drive the REAL
  #    built app in a real browser against a live backend + Postgres (lead→call,
  #    ops approve, portal approve), asserting the authoritative Postgres outcome;
  #    the visual specs lock every marketing page to the committed *-linux.png so a
  #    stray pixel (moved element, recoloured token, changed copy) fails the gate.
  #    Offline: local drivers, no external keys. The image already ships Node 24 +
  #    npm + ffmpeg, so no setup-node / apt install is needed.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      # Chromium needs a real /dev/shm or it crashes on the big full-page shots.
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipper
          POSTGRES_PASSWORD: clipper
          POSTGRES_DB: clipper
        options: >-
          --health-cmd "pg_isready -U clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # In a container job the DB service is reached by its label, not localhost.
      DATABASE_URL: postgres://clipper:clipper@postgres:5432/clipper
    steps:
      - uses: actions/checkout@v4
      - name: Backend deps + boot the API (auto-migrates on start)
        working-directory: backend
        run: |
          npm ci
          node src/server.js &
          node -e "const t=Date.now();(async()=>{while(Date.now()-t<60000){try{const r=await fetch('http://localhost:8080/api/health');if(r.ok){process.exit(0)}}catch{};await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
      - name: Build the frontend against the in-container API
        working-directory: frontend
        env:
          # Baked at build time; the browser then calls the backend cross-port and
          # the session cookie rides (CORS reflects the preview origin, credentials).
          VITE_API_BASE: http://localhost:8080
        run: |
          npm ci
          npm run build
      - name: Playwright journeys + visual design lock
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── secret scanning: fail the build on a committed credential.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── static analysis (CodeQL) over the JS/TS sources.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  # ── dependency review: block PRs that introduce high-severity dependencies.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
