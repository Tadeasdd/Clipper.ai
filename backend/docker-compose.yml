services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: clipper
    ports:
      - "5432:5432"
    volumes:
      - clipper_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clipper_pg_data:
