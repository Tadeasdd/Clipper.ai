# Clipper.ai — staging overlay (Capstone D5).
#
# Layers prod posture on top of the base stack and adds the canary (green) slot:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d backend
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile canary up -d --build backend-canary
#
# Don't drive these by hand — `ops/deploy/canary.sh` orchestrates the deploy,
# health-gates the canary on /readyz, then promotes or auto-rolls-back.
#
# "Mirrors prod" = NODE_ENV=production, so the boot guard (lib/config.js
# assertProdConfig) is ACTIVE: it requires non-dev PUBLISH_TOKEN_KEY +
# CONTENT_ENCRYPTION_KEY (>=16 chars) and DATABASE_URL. The defaults below are
# strong, clearly-labelled LOCAL placeholders so staging boots offline with zero
# external keys; a real staging environment overrides them from its secret store.

services:
  backend:
    environment:
      NODE_ENV: production
      # Local staging placeholders — NOT secrets, override in real staging.
      PUBLISH_TOKEN_KEY: "${PUBLISH_TOKEN_KEY:-staging-local-publish-key-change-me-0001}"
      CONTENT_ENCRYPTION_KEY: "${CONTENT_ENCRYPTION_KEY:-staging-local-content-key-change-me-0001}"
      # Lock CORS the way prod should (override with the real origin list).
      CORS_ORIGINS: "${CORS_ORIGINS:-https://staging.clipper.ai}"

  # ── canary (green) slot: an identical build of the backend on its own port,
  #    sharing the same db. ops/deploy/canary.sh starts it, waits for /readyz,
  #    then promotes the stable backend onto the new build — or tears the canary
  #    down and leaves the stable one serving (auto-rollback). ────────────────
  backend-canary:
    profiles: ["canary"]
    build:
      context: ./backend
      args:
        INSTALL_WHISPER: "${INSTALL_WHISPER:-false}"
    environment:
      # CANARY_DATABASE_URL lets the deploy script point a *test* canary at a bad
      # DSN to exercise the rollback path; defaults to the real staging db.
      DATABASE_URL: "${CANARY_DATABASE_URL:-postgres://clipper:clipper@db:5432/clipper}"
      PORT: "8080"
      NODE_ENV: production
      STORAGE_DRIVER: local
      TRANSCRIPTION_PROVIDER: "${TRANSCRIPTION_PROVIDER:-builtin}"
      LLM_PROVIDER: "${LLM_PROVIDER:-builtin}"
      PUBLISH_TOKEN_KEY: "${PUBLISH_TOKEN_KEY:-staging-local-publish-key-change-me-0001}"
      CONTENT_ENCRYPTION_KEY: "${CONTENT_ENCRYPTION_KEY:-staging-local-content-key-change-me-0001}"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://staging.clipper.ai}"
    ports:
      - "${CANARY_PORT:-8090}:8080"
    volumes:
      - clipper-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: "no"
